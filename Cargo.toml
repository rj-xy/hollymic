[package]
name = "hollymic"
version = "0.1.0"
edition = "2024"
description = "Tray app for the Hollyland Lark M2 wireless mic: noise cancellation, volume, battery, firmware check"
license = "MIT"
repository = "https://github.com/rj-xy/hollymic"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37.0"
env_logger = "0.11.11"
hex = "0.4.3"
log = "0.4.35"
md-5 = "0.11.0"
nusb = "0.2.9"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26.1"
